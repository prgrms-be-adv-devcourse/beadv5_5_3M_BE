# beadv5 microservice 차트 기본값.
# 각 서비스는 values/values-{서비스명}.yaml 에서 일부만 오버라이드합니다.

# ──────────────────────────────────────────
# 이름
# ──────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ──────────────────────────────────────────
# 이미지
# ──────────────────────────────────────────
image:
  repository: y0000h/CHANGE_ME_IN_VALUES   # 반드시 values-*.yaml 에서 오버라이드
  tag: latest
  pullPolicy: IfNotPresent

# ──────────────────────────────────────────
# Pod
# ──────────────────────────────────────────
replicaCount: 1   # 단일 노드라 사실상 1만 사용 (HA 불가)

podAnnotations: {}
podLabels: {}

securityContext:
  runAsNonRoot: false

# ──────────────────────────────────────────
# 컨테이너 포트 / Service
# ──────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  protocol: TCP

# ──────────────────────────────────────────
# 환경변수 (비밀 아닌 것)
# ──────────────────────────────────────────
env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m"

# 클러스터 내부 의존성 (모든 서비스 공통)
sharedEnv:
  KAFKA_BOOTSTRAP_SERVERS: "52.78.88.98:9092"
  REDIS_HOST: "redis-master.dev.svc.cluster.local"
  REDIS_PORT: "6379"
  DB_HOST: "postgres.dev.svc.cluster.local"
  DB_PORT: "5432"

# ──────────────────────────────────────────
# Secret 참조 (envFrom)
# values-*.yaml 에서 true/false 오버라이드
# ──────────────────────────────────────────
secretRefs:
  postgres: true       # 모든 서비스 (gateway 도 일단 true)
  jwt: true            # 인증 사용 서비스 모두
  toss: false          # payment 만 true
  aws: false           # user, streaming 만 true
  openai: false        # ai 만 true

# ──────────────────────────────────────────
# 리소스 (일반 7개 서비스 기본값)
# ──────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ──────────────────────────────────────────
# Liveness / Readiness Probe (Spring Boot Actuator 가정)
# ──────────────────────────────────────────
healthcheck:
  enabled: true
  path: /actuator/health
  livenessInitialDelay: 90
  livenessPeriod: 30
  readinessInitialDelay: 30
  readinessPeriod: 10

# ──────────────────────────────────────────
# Ingress (gateway 만 enabled)
# ──────────────────────────────────────────
ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ──────────────────────────────────────────
# HPA (선택, 노드 1대라 사실상 inactive)
# ──────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
