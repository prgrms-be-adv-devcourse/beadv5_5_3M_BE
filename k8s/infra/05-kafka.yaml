# Kafka 3.9 — KRaft 단일 노드 (ZooKeeper 없음)
#
# 코드에서 확인한 토픽 목록 (23개):
#   user.*          : user.created / user.updated / user.deleted
#   ticket.*        : ticket.reserved / ticket.cancelled / ticket.review.authorized
#                     ticket.provide / ticket.paid / ticket.refunded
#   creator.*       : creator.created / creator.updated
#   movie.*         : movie.uploaded / movie.updated / movie.deleted / movie.visibility
#                     movie.ai.created / movie.ai.updated / movie.schedule.confirmed / movie.liked
#   payment.*       : payment.confirmed / payment.failed / payment.refunded
#   settlement.*    : settlement.revenue.dlq
#
# 서비스들은 모두 KAFKA_BOOTSTRAP_SERVERS=kafka.dev.svc.cluster.local:9092 로 접근
# (application-prod.yaml 의 ${KAFKA_BOOTSTRAP_SERVERS} 참조)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-init
  namespace: dev
data:
  init-topics.sh: |
    #!/bin/bash
    set -e

    # Kafka가 완전히 뜰 때까지 대기
    echo "Waiting for Kafka to be ready..."
    until /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list &>/dev/null; do
      sleep 2
    done

    echo "Kafka ready. Creating topics..."

    create_topic() {
      local TOPIC=$1
      /opt/kafka/bin/kafka-topics.sh \
        --bootstrap-server localhost:9092 \
        --create --if-not-exists \
        --topic "$TOPIC" \
        --partitions 3 \
        --replication-factor 1
    }

    # user-service 발행
    create_topic user.created
    create_topic user.updated
    create_topic user.deleted

    # ticket-service 발행
    create_topic ticket.reserved
    create_topic ticket.cancelled
    create_topic ticket.review.authorized
    create_topic ticket.provide
    create_topic ticket.paid
    create_topic ticket.refunded

    # creator-service 발행
    create_topic creator.created
    create_topic creator.updated
    create_topic movie.uploaded
    create_topic movie.updated
    create_topic movie.deleted
    create_topic movie.visibility
    create_topic movie.ai.created
    create_topic movie.ai.updated
    create_topic movie.schedule.confirmed

    # movie-service 발행
    create_topic movie.liked

    # payment-service 발행
    create_topic payment.confirmed
    create_topic payment.failed
    create_topic payment.refunded

    # settlement-service DLQ
    create_topic settlement.revenue.dlq

    echo "All topics created."
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: dev
spec:
  serviceName: kafka
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.dev.svc.cluster.local:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
            - name: CLUSTER_ID
              value: "q1Wp4MzxTsGLt2PxaHFqXA"
          resources:
            requests:
              memory: "640Mi"
            limits:
              memory: "768Mi"
          ports:
            - containerPort: 9092
              name: broker
            - containerPort: 9093
              name: controller
          volumeMounts:
            - mountPath: /var/lib/kafka/data
              name: kafka-data
            - mountPath: /docker-init-topics
              name: kafka-init
          lifecycle:
            postStart:
              exec:
                command: ["/bin/bash", "/docker-init-topics/init-topics.sh"]
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: dev
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
