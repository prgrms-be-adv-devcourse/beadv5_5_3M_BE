apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
  namespace: dev
data:
  init.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE ai_db;
      CREATE DATABASE user_db;
      CREATE DATABASE creator_db;
      CREATE DATABASE payment_db;
      CREATE DATABASE ticket_db;
      CREATE DATABASE settlement_db;
      CREATE DATABASE streaming_db;
    EOSQL

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "ai_db" <<-EOSQL
      CREATE EXTENSION IF NOT EXISTS vector;
    EOSQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: dev
spec:
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      # Taint 없는 t3.large(agent)에 뜸 (별도 설정 불필요)
      containers:
        - name: postgresql
          image: pgvector/pgvector:pg18
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USERNAME
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "768Mi"
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresql-data
            - mountPath: /docker-entrypoint-initdb.d
              name: postgresql-init
      volumes:
        - name: postgresql-init
          configMap:
            name: postgresql-init
            defaultMode: 0755   # 실행 권한 부여
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: dev
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
