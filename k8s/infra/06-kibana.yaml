# Kibana 9.0.0 — Elasticsearch 9.0.0 연동
# - Elasticsearch: http://elasticsearch.dev.svc.cluster.local:9200
# - NodePort 30056 으로 외부 접근 (http://3.34.92.255:30056)
# - master 노드에 배치 (ES와 같은 노드)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: dev
spec:
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      tolerations:
        - key: dedicated
          value: es
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: ip-172-31-42-216
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.0.0
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "http://elasticsearch.dev.svc.cluster.local:9200"
            - name: SERVER_HOST
              value: "0.0.0.0"
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "1Gi"
          ports:
            - containerPort: 5601
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: dev
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
      nodePort: 30056
