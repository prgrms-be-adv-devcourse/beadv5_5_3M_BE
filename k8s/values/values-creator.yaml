# creator-service (포트 8080)
# - 영화/제작사 정보 관리
# - DB: creator_db
# - Redis 캐싱 사용
# - JWT 인증 사용

image:
  repository: qor7777777/creator-service
  tag: latest
  pullPolicy: Always

service:
  port: 8080
  targetPort: 8080

env:
  SERVER_PORT: "8080"
  # DDL_AUTO: "update"  # 템플릿 기본값(validate) 사용
  SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: "3GB"
  SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: "3GB"
  # 시연용 lifecycle 가속 (운영 default 는 PT4M / PT4M / PT10M / PT10M)
  CREATOR_MIN_REGISTRATION_LEAD: "PT1M"
  CREATOR_MIN_TICKETING_WINDOW: "PT5M"
  CREATOR_BATCH_WAITING_LEAD: "PT1M"
  CREATOR_BATCH_COMPLETED_TOLERANCE: "PT2M"

volumeMounts:
  - name: uploads
    mountPath: /root/uploads

volumes:
  - name: uploads
    hostPath:
      path: /home/ubuntu/s3-bucket
      type: DirectoryOrCreate

secretRefs:
  postgres: true
  jwt: true
  toss: false
  aws: false
  openai: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 640Mi

healthcheck:
  enabled: true
  path: /actuator/health
  livenessInitialDelay: 180
  livenessPeriod: 30
  readinessInitialDelay: 60
  readinessPeriod: 10

ingress:
  enabled: false
