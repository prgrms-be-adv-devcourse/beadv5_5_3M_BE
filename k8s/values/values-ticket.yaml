# ticket-service (포트 8084) — Redis 동시성 제어
# - DB: ticket_db
# - user-service HTTP 호출 의존

image:
  repository: qor7777777/ticket-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8084
  targetPort: 8084

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_OPTS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m"
  SERVER_PORT: "8084"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql.dev.svc.cluster.local:5432/ticket_db"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "_OVERRIDE_FROM_SECRET_"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "52.78.88.98:9092"
  SPRING_DATA_REDIS_HOST: "redis.dev.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  CLIENT_USER_BASE_URL: "http://user-service.dev.svc.cluster.local:8085"
  DDL_AUTO: "update"

sharedEnv: {}

secretRefs:
  postgres: true
  jwt: false
  toss: false
  aws: false
  openai: false

resources:
  requests:
    cpu: 150m
    memory: 448Mi     # 동시성 처리 메모리 +
  limits:
    cpu: 600m
    memory: 768Mi     # docker-compose 와 동일

healthcheck:
  enabled: true
  path: /actuator/health
  livenessInitialDelay: 90
  livenessPeriod: 30
  readinessInitialDelay: 30
  readinessPeriod: 10

ingress:
  enabled: false
