# settlement-service (포트 8083) — 정산 + DLQ 처리
# - DB: settlement_db
# - creator-service HTTP 호출 의존

image:
  repository: qor7777777/settlement-service
  tag: latest
  pullPolicy: Always

service:
  port: 8083
  targetPort: 8083

env:
  SERVER_PORT: "8083"
  DB_NAME: "settlement_db"
  # DDL_AUTO: "update"  # 템플릿 기본값(validate) 사용
  CLIENT_CREATOR_BASE_URL: "http://creator-service-microservice.dev.svc.cluster.local:8080"
  SETTLEMENT_FEE_RATE: "0.1"
  SETTLEMENT_COOKIE_TO_KRW_RATE: "100"
  SETTLEMENT_DLQ_FALLBACK_PATH: "/tmp/settlement-dlq"
  SETTLEMENT_DLQ_MAX_RETRY: "5"
  SPRING_TASK_SCHEDULING_TIMEZONE: "Asia/Seoul"

secretRefs:
  postgres: true
  jwt: false
  toss: false
  aws: false
  openai: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 640Mi

healthcheck:
  enabled: true
  path: /actuator/health
  livenessInitialDelay: 180
  livenessPeriod: 30
  readinessInitialDelay: 60
  readinessPeriod: 10

ingress:
  enabled: false
