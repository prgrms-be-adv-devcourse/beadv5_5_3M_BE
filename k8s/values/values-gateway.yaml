# gateway-service (포트 8000) — 외부 진입점, JWT 검증, Spring Cloud Gateway 라우팅
# - DB 불필요 (Stateless)
# - Ingress 활성 (Traefik via EIP)

image:
  repository: qor7777777/gateway-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8000
  targetPort: 8000

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_OPTS: "-Xms64m -Xmx180m -XX:MaxMetaspaceSize=80m"
  SERVER_PORT: "8000"
  # Spring Boot 4 + Spring Cloud Gateway 5 환경에서 자동 web type 결정 실패
  # → 강제로 reactive 모드 명시 (Netty HTTP 서버 띄우기)
  SPRING_MAIN_WEB_APPLICATION_TYPE: "reactive"
  # Actuator K8s probes endpoint 활성화
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  # 라우팅 대상 (K3s ClusterIP DNS)
  # Service 실제 이름은 chart 의 fullname 헬퍼가 만든 "{release}-microservice" 형태
  USER_SERVICE_HOST: "http://user-service-microservice.dev.svc.cluster.local:8085"
  CREATOR_SERVICE_HOST: "http://creator-service-microservice.dev.svc.cluster.local:8080"
  CREATOR_SERVICE_URL: "http://creator-service-microservice.dev.svc.cluster.local:8080"
  PAYMENT_SERVICE_URL: "http://payment-service-microservice.dev.svc.cluster.local:8081"
  SETTLEMENT_SERVICE_URL: "http://settlement-service-microservice.dev.svc.cluster.local:8083"
  TICKET_SERVICE_URL: "http://ticket-service-microservice.dev.svc.cluster.local:8084"
  USER_SERVICE_URL: "http://user-service-microservice.dev.svc.cluster.local:8085"
  MOVIE_SERVICE_URL: "http://movie-service-microservice.dev.svc.cluster.local:8086"
  STREAMING_SERVICE_URL: "http://streaming-service-microservice.dev.svc.cluster.local:8088"
  AI_SERVICE_URL: "http://ai-service-microservice.dev.svc.cluster.local:8089"

secretRefs:
  postgres: false   # gateway DB 안 씀
  jwt: true         # JWT_TOKEN_PUBLIC 검증
  toss: false
  aws: false
  openai: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 384Mi   # docker-compose 와 동일

healthcheck:
  enabled: true
  path: /actuator/health
  livenessInitialDelay: 120
  livenessPeriod: 30
  readinessInitialDelay: 90
  readinessPeriod: 10

ingress:
  enabled: true
  className: traefik
  annotations:
    # 큰 영상 업로드 대비 (gateway 가 streaming 으로 프록시)
    traefik.ingress.kubernetes.io/buffering-max-request-bytes: "524288000"  # 500MB
    # DNS가 EC2 EIP로 변경된 후 아래 주석 해제
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: "3m-msa.p-e.kr"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gateway-tls
      hosts:
        - 3m-msa.p-e.kr
