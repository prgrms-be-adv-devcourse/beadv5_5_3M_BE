# ============================================================
#  movie-service — Production Profile
#  활성화: SPRING_PROFILES_ACTIVE=prod (환경 변수로 주입)
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/creator_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 30000
      pool-name: MovieHikariPool

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: movie-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # Elasticsearch (검색 + 자동완성 + 하이라이트)
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s

  # Redis (인기 검색어 Sorted Set)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ES 기반 검색 기능 on/off 스위치 (false 면 JPA LIKE 로 동작)
movie:
  elasticsearch:
    enabled: ${MOVIE_ES_ENABLED:true}

server:
  port: ${SERVER_PORT:8086}

logging:
  level:
    root: WARN
    com.example.movieservice: INFO
    org.springframework.kafka: WARN
    org.hibernate: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false