map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP — ACME HTTP-01 challenge + HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name 3m-msa.p-e.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — gateway-service reverse proxy + WebSocket upgrade
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 3m-msa.p-e.kr;

    # 영상 업로드 등 대용량 요청 허용 (기본 1MB → 2GB)
    client_max_body_size 2g;
    client_body_timeout 600s;

    ssl_certificate     /etc/letsencrypt/live/3m-msa.p-e.kr-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3m-msa.p-e.kr-0001/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # FE(Vercel HTTPS)에서 wss:// 핸드셰이크가 들어오므로 Upgrade 헤더 통과 필수
    location / {
        proxy_pass http://gateway-service:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 장시간 WS 연결 허용
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
