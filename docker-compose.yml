services:

  # ──────────────────────────────────────────
  # Caddy (TLS 종료 + reverse proxy)
  # - apex 도메인 3m-msa.p-e.kr 으로 노출
  # - Let's Encrypt 자동 발급/갱신, WebSocket upgrade 통과
  # - HTTP-01 challenge용 80, 운영 트래픽 443
  # ──────────────────────────────────────────
  caddy:
    profiles: [caddy]
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [app-network]

  # ──────────────────────────────────────────
  # Gateway Service (포트 8000)
  # - 모든 외부 요청의 진입점 (JWT 인증/인가 처리)
  # - DB 불필요 (Stateless)
  # ──────────────────────────────────────────
  gateway-service:
    profiles: [gateway-service]
    image: ${DOCKERHUB_USERNAME}/gateway-service:latest
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      SERVER_PORT: ${GATEWAY_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_PROFILES_ACTIVE: prod
      JWT_TOKEN_PUBLIC: ${JWT_TOKEN_PUBLIC}
      USER_SERVICE_HOST: http://user-service:${USER_PORT}
      CREATOR_SERVICE_HOST: http://creator-service:${CREATOR_PORT}
      BASE_IP: ${BASE_IP}
      CREATOR_PORT: ${CREATOR_PORT}
      PAYMENT_PORT: ${PAYMENT_PORT}
      SETTLEMENT_PORT: ${SETTLEMENT_PORT}
      TICKET_PORT: ${TICKET_PORT}
      USER_PORT: ${USER_PORT}
      MOVIE_PORT: ${MOVIE_PORT}
      STREAMING_PORT: ${STREAMING_PORT}
      AI_PORT: ${AI_PORT}
    mem_limit: 384m
    mem_reservation: 256m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Creator Service (포트 8080)
  # - 영화/제작사 정보 관리
  # - Redis 캐싱 사용 예정
  # ──────────────────────────────────────────
  creator-service:
    profiles: [creator-service]
    image: ${DOCKERHUB_USERNAME}/creator-service:latest
    container_name: creator-service
    ports:
      - "${CREATOR_PORT}:${CREATOR_PORT}"
    volumes:
      - /home/ubuntu/s3-bucket:/root/uploads
    environment:
      SERVER_PORT: ${CREATOR_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/creator_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_PROFILES_ACTIVE: prod
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
      DDL_AUTO: ${DDL_AUTO}
      FILE_UPLOAD_BASE_PATH: /root/uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 500MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 500MB
    mem_limit: 640m
    mem_reservation: 384m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Payment Service (포트 8081)
  # - 결제 처리 및 결제 상태 관리
  # ──────────────────────────────────────────
  payment-service:
    profiles: [payment-service]
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    container_name: payment-service
    ports:
      - "${PAYMENT_PORT}:${PAYMENT_PORT}"
    environment:
      SERVER_PORT: ${PAYMENT_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOSS_PAYMENT_SECRET: ${TOSS_PAYMENT_SECRET}
      TOSS_PAYMENT_CK: ${TOSS_PAYMENT_CK}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 640m
    mem_reservation: 384m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Settlement Service (포트 8083)
  # - 제작사 수익 정산 처리
  # - creator-service HTTP 호출 의존 (함께 실행 필요)
  # ──────────────────────────────────────────
  settlement-service:
    profiles: [settlement-service]
    image: ${DOCKERHUB_USERNAME}/settlement-service:latest
    container_name: settlement-service
    ports:
      - "${SETTLEMENT_PORT}:${SETTLEMENT_PORT}"
    environment:
      SERVER_PORT: ${SETTLEMENT_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/settlement_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CLIENT_CREATOR_BASE_URL: http://creator-service:${CREATOR_PORT}
      SPRING_PROFILES_ACTIVE: prod
      SETTLEMENT_FEE_RATE: ${SETTLEMENT_FEE_RATE}
      SETTLEMENT_COOKIE_TO_KRW_RATE: ${SETTLEMENT_COOKIE_TO_KRW_RATE}
      SETTLEMENT_DLQ_FALLBACK_PATH: ${SETTLEMENT_DLQ_FALLBACK_PATH}
      SETTLEMENT_DLQ_MAX_RETRY: ${SETTLEMENT_DLQ_MAX_RETRY}
      SPRING_TASK_SCHEDULING_TIMEZONE: Asia/Seoul
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 640m
    mem_reservation: 384m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Ticket Service (포트 8084)
  # - 티켓 예약/취소 처리, Redis로 동시성 제어
  # - user-service HTTP 호출 의존 (함께 실행 필요)
  # ──────────────────────────────────────────
  ticket-service:
    profiles: [ticket-service]
    image: ${DOCKERHUB_USERNAME}/ticket-service:latest
    container_name: ticket-service
    ports:
      - "${TICKET_PORT}:${TICKET_PORT}"
    environment:
      SERVER_PORT: ${TICKET_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      CLIENT_USER_BASE_URL: http://user-service:${USER_PORT}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 768m
    mem_reservation: 448m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # User Service (포트 8085)
  # - 사용자 관리, Redis 세션, AWS S3 파일 저장
  # ──────────────────────────────────────────
  user-service:
    profiles: [user-service]
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    container_name: user-service
    ports:
      - "${USER_PORT}:${USER_PORT}"
    environment:
      SERVER_PORT: ${USER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      SPRING_PROFILES_ACTIVE: prod
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 640m
    mem_reservation: 384m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Movie Service (포트 8086)
  # - 영화 정보 관리
  # ──────────────────────────────────────────
  movie-service:
    profiles: [movie-service]
    image: ${DOCKERHUB_USERNAME}/movie-service:latest
    container_name: movie-service
    ports:
      - "${MOVIE_PORT}:${MOVIE_PORT}"
    environment:
      SERVER_PORT: ${MOVIE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/creator_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      MOVIE_ES_ENABLED: ${MOVIE_ES_ENABLED:-false}
      ES_URIS: ${ES_URIS:-http://localhost:9200}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 640m
    mem_reservation: 384m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Streaming Service (포트 8088)
  # - 라이브 HLS 재생 + WebSocket/STOMP 채팅 + Quartz JDBC jobstore
  # - creator-service HTTP 의존 (영화 위치 조회)
  # ──────────────────────────────────────────
  streaming-service:
    profiles: [streaming-service]
    image: ${DOCKERHUB_USERNAME}/streaming-service:latest
    container_name: streaming-service
    ports:
      - "${STREAMING_PORT}:${STREAMING_PORT}"
    volumes:
      - /home/ubuntu/s3-bucket:/root/uploads
    environment:
      SERVER_PORT: ${STREAMING_PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      DB_NAME: streaming_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID_STREAMING}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      STREAMING_JWT_SECRET: ${STREAMING_JWT_SECRET}
      STREAMING_ADDRESS_ADAPTER: ${STREAMING_ADDRESS_ADAPTER}
      STREAMING_PUBLIC_BASE_URL: ${STREAMING_PUBLIC_BASE_URL}
      CLIENT_CREATOR_BASE_URL: http://creator-service:${CREATOR_PORT}
      STORAGE_S3_PATH: ${STORAGE_S3_PATH}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 896m
    mem_reservation: 512m
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # AI Service (포트 8089)
  # - OpenAI 임베딩/요약/리랭킹 + pgvector 기반 추천
  # - Kafka 이벤트 소비(movie/ticket/user)로만 연계, HTTP 아웃바운드 없음
  # ──────────────────────────────────────────
  ai-service:
    profiles: [ai-service]
    image: ${DOCKERHUB_USERNAME}/ai-service:latest
    container_name: ai-service
    ports:
      - "${AI_PORT}:${AI_PORT}"
    environment:
      SERVER_PORT: ${AI_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/ai_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    mem_limit: 896m
    mem_reservation: 512m
    restart: unless-stopped
    networks: [app-network]

# ──────────────────────────────────────────
# Networks
# - app-network: 모든 컨테이너가 컨테이너 이름으로
#   서로 통신 가능 (예: http://creator-service:8080)
# ──────────────────────────────────────────
networks:
  app-network:
    driver: bridge

# ──────────────────────────────────────────
# Volumes
# - caddy_data: Let's Encrypt 인증서 / ACME 계정 키 보존
# - caddy_config: Caddy 자동 설정 캐시
# ──────────────────────────────────────────
volumes:
  caddy_data:
  caddy_config: