services:

  # ──────────────────────────────────────────
  # Gateway Service (포트 8000)
  # - 모든 외부 요청의 진입점 (JWT 인증/인가 처리)
  # - DB 불필요 (Stateless)
  # ──────────────────────────────────────────
  gateway-service:
    profiles: [gateway-service]
    image: ${DOCKERHUB_USERNAME}/gateway-service:latest
    container_name: gateway-service
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      SERVER_PORT: ${GATEWAY_PORT}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_PROFILES_ACTIVE: prod
      JWT_TOKEN_PUBLIC: ${JWT_TOKEN_PUBLIC}
      USER_SERVICE_HOST: http://user-service:${USER_PORT}
      CREATOR_SERVICE_HOST: http://creator-service:${CREATOR_PORT}
      BASE_IP: ${BASE_IP}
      CREATOR_PORT: ${CREATOR_PORT}
      PAYMENT_PORT: ${PAYMENT_PORT}
      SETTLEMENT_PORT: ${SETTLEMENT_PORT}
      TICKET_PORT: ${TICKET_PORT}
      USER_PORT: ${USER_PORT}
      MOVIE_PORT: ${MOVIE_PORT}
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Creator Service (포트 8080)
  # - 영화/제작사 정보 관리
  # - Redis 캐싱 사용 예정
  # ──────────────────────────────────────────
  creator-service:
    profiles: [creator-service]
    image: ${DOCKERHUB_USERNAME}/creator-service:latest
    container_name: creator-service
    ports:
      - "${CREATOR_PORT}:${CREATOR_PORT}"
    volumes:
      - /home/ubuntu/s3-bucket:/root/uploads
    environment:
      SERVER_PORT: ${CREATOR_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/creator_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_PROFILES_ACTIVE: prod
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
      DDL_AUTO: ${DDL_AUTO}
      FILE_UPLOAD_BASE_PATH: /root/uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 500MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 500MB
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Payment Service (포트 8081)
  # - 결제 처리 및 결제 상태 관리
  # ──────────────────────────────────────────
  payment-service:
    profiles: [payment-service]
    image: ${DOCKERHUB_USERNAME}/payment-service:latest
    container_name: payment-service
    ports:
      - "${PAYMENT_PORT}:${PAYMENT_PORT}"
    environment:
      SERVER_PORT: ${PAYMENT_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/payment_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      TOSS_PAYMENT_SECRET: ${TOSS_PAYMENT_SECRET}
      TOSS_PAYMENT_CK: ${TOSS_PAYMENT_CK}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Settlement Service (포트 8083)
  # - 제작사 수익 정산 처리
  # - creator-service HTTP 호출 의존 (함께 실행 필요)
  # ──────────────────────────────────────────
  settlement-service:
    profiles: [settlement-service]
    image: ${DOCKERHUB_USERNAME}/settlement-service:latest
    container_name: settlement-service
    ports:
      - "${SETTLEMENT_PORT}:${SETTLEMENT_PORT}"
    environment:
      SERVER_PORT: ${SETTLEMENT_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/settlement_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      CLIENT_CREATOR_BASE_URL: http://creator-service:${CREATOR_PORT}
      SPRING_PROFILES_ACTIVE: prod
      SETTLEMENT_FEE_RATE: ${SETTLEMENT_FEE_RATE}
      SETTLEMENT_COOKIE_TO_KRW_RATE: ${SETTLEMENT_COOKIE_TO_KRW_RATE}
      SETTLEMENT_DLQ_FALLBACK_PATH: ${SETTLEMENT_DLQ_FALLBACK_PATH}
      SETTLEMENT_DLQ_MAX_RETRY: ${SETTLEMENT_DLQ_MAX_RETRY}
      SPRING_TASK_SCHEDULING_TIMEZONE: Asia/Seoul
      DDL_AUTO: ${DDL_AUTO}
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Ticket Service (포트 8084)
  # - 티켓 예약/취소 처리, Redis로 동시성 제어
  # - user-service HTTP 호출 의존 (함께 실행 필요)
  # ──────────────────────────────────────────
  ticket-service:
    profiles: [ticket-service]
    image: ${DOCKERHUB_USERNAME}/ticket-service:latest
    container_name: ticket-service
    ports:
      - "${TICKET_PORT}:${TICKET_PORT}"
    environment:
      SERVER_PORT: ${TICKET_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/ticket_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      CLIENT_USER_BASE_URL: http://user-service:${USER_PORT}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # User Service (포트 8085)
  # - 사용자 관리, Redis 세션, AWS S3 파일 저장
  # ──────────────────────────────────────────
  user-service:
    profiles: [user-service]
    image: ${DOCKERHUB_USERNAME}/user-service:latest
    container_name: user-service
    ports:
      - "${USER_PORT}:${USER_PORT}"
    environment:
      SERVER_PORT: ${USER_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/user_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      SPRING_PROFILES_ACTIVE: prod
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      DDL_AUTO: ${DDL_AUTO}
    restart: unless-stopped
    networks: [app-network]

  # ──────────────────────────────────────────
  # Movie Service (포트 8086)
  # - 영화 정보 관리
  # ──────────────────────────────────────────
  movie-service:
    profiles: [movie-service]
    image: ${DOCKERHUB_USERNAME}/movie-service:latest
    container_name: movie-service
    ports:
      - "${MOVIE_PORT}:${MOVIE_PORT}"
    environment:
      SERVER_PORT: ${MOVIE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:5432/creator_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_PROFILES_ACTIVE: prod
      DDL_AUTO: ${DDL_AUTO}
    restart: unless-stopped
    networks: [app-network]

# ──────────────────────────────────────────
# Networks
# - app-network: 모든 컨테이너가 컨테이너 이름으로
#   서로 통신 가능 (예: http://creator-service:8080)
# ──────────────────────────────────────────
networks:
  app-network:
    driver: bridge