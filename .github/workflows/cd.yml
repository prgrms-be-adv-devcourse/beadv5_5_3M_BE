name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          chmod +x .github/scripts/detect-changed-services-cicd.sh
          SERVICES=$(.github/scripts/detect-changed-services-cicd.sh \
            "${{ github.event.before }}" \
            "${{ github.sha }}")
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [[ "$SERVICES" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::변경된 서비스 없음 — CD 스킵"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::배포 대상 서비스: $SERVICES"
          fi

  build-for-deploy:
    name: Build — ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    uses: ./.github/workflows/build-test-service.yml
    with:
      service: ${{ matrix.service }}

  docker-build-push:
    name: Docker Build & Push — ${{ matrix.service }}
    needs: [detect-changes, build-for-deploy]
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.build-for-deploy.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}-${{ github.sha }}
          path: ${{ matrix.service }}/build/libs/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-to-ec2:
    name: Deploy to EC2 — ${{ matrix.service }}
    needs: [detect-changes, docker-build-push]
    if: needs.detect-changes.outputs.has_changes == 'true' && needs.docker-build-push.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ~/app/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose --profile ${{ matrix.service }} pull
            docker compose --profile ${{ matrix.service }} up -d --remove-orphans
            docker image prune -f

  cd-summary:
    name: CD Summary
    needs: [detect-changes, docker-build-push, deploy-to-ec2]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          DOCKER_RESULT="${{ needs.docker-build-push.result }}"
          DEPLOY_RESULT="${{ needs.deploy-to-ec2.result }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"

          echo "## CD 결과 — \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 서비스 | Docker Hub | EC2 배포 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----------|---------|" >> "$GITHUB_STEP_SUMMARY"

          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            DOCKER_ICON=$([[ "$DOCKER_RESULT" == "success" ]] && echo "✅" || echo "❌")
            DEPLOY_ICON=$([[ "$DEPLOY_RESULT" == "success" ]] && echo "✅" || echo "❌")
            echo "| \`$svc\` | $DOCKER_ICON | $DEPLOY_ICON |" >> "$GITHUB_STEP_SUMMARY"
          done
