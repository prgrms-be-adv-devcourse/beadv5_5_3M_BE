name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        run: |
          chmod +x .github/scripts/detect-changed-services-cicd.sh
          SERVICES=$(.github/scripts/detect-changed-services-cicd.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}")
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [[ "$SERVICES" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::변경된 서비스 없음 — 빌드 스킵"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::변경된 서비스: $SERVICES"
          fi

  build-and-test:
    name: Build — ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    uses: ./.github/workflows/build-test-service.yml
    with:
      service: ${{ matrix.service }}

  no-changes-notice:
    name: No Service Changes — CI Skipped
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          echo "## ⏭️ CI 스킵" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "변경된 서비스 없음 — 빌드를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"

  ci-summary:
    name: CI Summary
    needs: [detect-changes, build-and-test, no-changes-notice]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate result
        run: |
          HAS_CHANGES="${{ needs.detect-changes.outputs.has_changes }}"
          BUILD_RESULT="${{ needs.build-and-test.result }}"

          if [[ "$HAS_CHANGES" == "false" ]]; then
            echo "서비스 변경 없음 — 통과"
            exit 0
          fi

          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::빌드 실패 (result: $BUILD_RESULT)"
            exit 1
          fi

          echo "모든 서비스 빌드 성공"
