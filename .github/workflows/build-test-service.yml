name: Build (Reusable)

on:
  workflow_call:
    inputs:
      service:
        description: '빌드할 서비스 디렉토리명 (예: ticket-service)'
        required: true
        type: string
    outputs:
      build_status:
        description: '빌드 결과 (success | failure)'
        value: ${{ jobs.build.outputs.build_status }}

jobs:
  build:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest
    outputs:
      build_status: ${{ steps.build.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ inputs.service }}-gradle-${{ hashFiles(format('{0}/build.gradle', inputs.service), format('{0}/build.gradle.kts', inputs.service), format('{0}/gradle/wrapper/gradle-wrapper.properties', inputs.service)) }}
          restore-keys: |
            ${{ inputs.service }}-gradle-

      - name: Build
        id: build
        working-directory: ${{ inputs.service }}
        run: ./gradlew build -x test --no-daemon

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ inputs.service }}-${{ github.sha }}
          path: |
            ${{ inputs.service }}/build/libs/*.jar
            !${{ inputs.service }}/build/libs/*-plain.jar
          retention-days: 1

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ inputs.service }}
          path: ${{ inputs.service }}/build/reports/
          retention-days: 3
