name: PR Review (Gemini AI)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - 'dev/*'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: 변경된 서비스 감지
  # ─────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed *-service directories
        id: detect
        run: |
          chmod +x .github/scripts/detect-changed-services.sh
          SERVICES=$(.github/scripts/detect-changed-services.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}")
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          if [[ "$SERVICES" == "[]" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::서비스 변경 없음 — 리뷰 스킵"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "::notice::변경된 서비스: $SERVICES"
          fi

  # ─────────────────────────────────────────────
  # Job 2: Gemini AI 코드 리뷰
  # ─────────────────────────────────────────────
  gemini-review:
    name: Gemini Code Review
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      MAX_OUTPUT_TOKENS: 65536
      MAX_INPUT_TOKENS_PER_PR: 100000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GEMINI_API_KEY
        run: |
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::GEMINI_API_KEY secret이 설정되지 않았습니다."
            echo "::error::Repository Settings > Secrets > GEMINI_API_KEY를 등록하세요."
            exit 1
          fi

      - name: Install dependencies (jq, gh)
        run: |
          sudo apt-get install -y jq
          # gh CLI는 ubuntu-latest에 기본 포함

      - name: Prepare review workspace
        run: |
          mkdir -p /tmp/gemini_results
          mkdir -p /tmp/gemini_prompts
          # workflow summary 헤더
          echo "## 🤖 Gemini 코드 리뷰 토큰 사용량" >> "$GITHUB_STEP_SUMMARY"
          echo "| 모델 | 입력 토큰 | 출력 토큰 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|----------|----------|" >> "$GITHUB_STEP_SUMMARY"

      - name: Build review prompts and call Gemini
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/build-gemini-prompt.sh
          chmod +x .github/scripts/call-gemini-api.sh

          SERVICES='${{ needs.detect-changes.outputs.services }}'
          echo "리뷰 대상 서비스: $SERVICES"

          # PR diff 전체 가져오기 (API 300파일 제한 우회 — 로컬 git 사용)
          git diff "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > /tmp/full_pr.diff

          # 토큰 예산 (바이트 / 4 ≈ 토큰 추정)
          MAX_TOKENS=${{ env.MAX_INPUT_TOKENS_PER_PR }}
          BUDGET_BYTES=$((MAX_TOKENS * 4))
          USED_BYTES=0

          echo "$SERVICES" | jq -r '.[]' | while read -r SERVICE; do
            echo "──────────────────────────────────"
            echo "🔍 $SERVICE 리뷰 시작"

            # 서비스별 diff 추출 (awk로 해당 서비스 경로 diff 블록만 추출)
            # 제외: 문서·테스트·빌드·스크립트·인프라 설정 등 리뷰 불필요 파일
            #   - 문서/설정 확장자: md / sql / py / gradle / json / sh / txt / properties
            #   - 메타 파일: .gitignore / .gitattributes / .dockerignore / .claudeignore / *.iml / *.lock / *.log / *.jar / *.class
            #   - 인프라: Dockerfile / gradlew / gradle/wrapper/
            #   - 테스트: *Test.java / *Tests.java / src/test/
            #   - 서비스 외곽 디렉토리: e2e/ local/ docs/ (ticket-service, streaming-service 참조)
            #   - 빌드/IDE 산출물: build/ out/ bin/ .gradle/ .idea/ .vscode/
            #   - 정적 리소스: src/main/resources/static/ templates/ public/
            awk -v svc="$SERVICE/" '
              /^diff --git / {
                excluded = ($0 ~ /\.(md|sql|py|gradle|json|sh|txt|properties|gitignore|gitattributes|dockerignore|claudeignore|iml|lock|log|jar|class)"?$/) ||
                           ($0 ~ /(^|\/)Dockerfile"?$/) ||
                           ($0 ~ /gradlew(\.bat)?"?$/) ||
                           ($0 ~ /\/gradle\/wrapper\//) ||
                           ($0 ~ /(Test|Tests)\.java"?$/) ||
                           ($0 ~ /\/src\/test\//) ||
                           ($0 ~ /\/(e2e|local|docs)\//) ||
                           ($0 ~ /\/(build|out|bin|\.gradle|\.idea|\.vscode)\//) ||
                           ($0 ~ /\/src\/main\/resources\/(static|templates|public)\//)
                in_svc = ($0 ~ svc) && !excluded
              }
              in_svc { print }
            ' /tmp/full_pr.diff > /tmp/service_diff.txt || true

            # diff가 없으면 스킵
            if [[ ! -s /tmp/service_diff.txt ]]; then
              echo "::notice::$SERVICE diff 없음 — 스킵"
              continue
            fi

            DIFF_SIZE=$(wc -c < /tmp/service_diff.txt)

            # 토큰 예산 초과 체크
            PROJECTED=$((USED_BYTES + DIFF_SIZE))
            if [[ $PROJECTED -gt $BUDGET_BYTES ]]; then
              echo "::warning::$SERVICE 토큰 예산 초과 (사용: ${USED_BYTES}B / 한도: ${BUDGET_BYTES}B) — 스킵" >&2
              echo "{\"service\":\"$SERVICE\",\"summary\":\"토큰 예산 초과로 리뷰를 건너뜁니다.\",\"findings\":[],\"praise\":[]}" \
                > /tmp/gemini_results/${SERVICE}.json
              continue
            fi

            # diff가 128KB 초과이면 파일 수 제한 (상위 30개 파일만)
            if [[ $DIFF_SIZE -gt 131072 ]]; then
              echo "::warning::$SERVICE diff 크기 ${DIFF_SIZE}B > 128KB — 상위 30개 파일로 제한" >&2
              awk '
                /^diff --git / { file_count++; in_block=1 }
                file_count > 30 { next }
                in_block { print }
              ' /tmp/service_diff.txt > /tmp/service_diff_trimmed.txt
              mv /tmp/service_diff_trimmed.txt /tmp/service_diff.txt
              DIFF_SIZE=$(wc -c < /tmp/service_diff.txt)
            fi

            USED_BYTES=$((USED_BYTES + DIFF_SIZE))

            # 프롬프트 조립
            .github/scripts/build-gemini-prompt.sh \
              "$SERVICE" \
              /tmp/service_diff.txt \
              /tmp/gemini_prompts/${SERVICE}_prompt.txt

            # Gemini API 호출
            if .github/scripts/call-gemini-api.sh \
              /tmp/gemini_prompts/${SERVICE}_prompt.txt \
              /tmp/gemini_results/${SERVICE}.json; then
              echo "✅ $SERVICE 리뷰 완료"
            else
              echo "::warning::$SERVICE 리뷰 실패 — 스킵"
              # 실패 시 빈 결과 생성
              echo "{\"service\":\"$SERVICE\",\"summary\":\"리뷰 중 오류가 발생했습니다.\",\"findings\":[],\"praise\":[]}" \
                > /tmp/gemini_results/${SERVICE}.json
            fi
          done

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/post-review-comment.sh

          # 결과 파일 존재 확인
          if ls /tmp/gemini_results/*.json 1>/dev/null 2>&1; then
            .github/scripts/post-review-comment.sh \
              ${{ github.event.pull_request.number }} \
              /tmp/gemini_results
          else
            echo "::notice::리뷰 결과 없음 — 코멘트 스킵"
          fi
