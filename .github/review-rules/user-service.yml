version: 1
scope: service
service: user-service

rules:
  - id: USR-001
    severity: CRITICAL
    title: JWT 시크릿 키 하드코딩
    description: >
      application-dev.yaml의 jwt.private-key 또는 jwt.public-key가 소스코드에 포함된 경우.
      JWT 키는 환경 변수 또는 Secrets Manager를 통해 주입해야 함.

  - id: USR-002
    severity: CRITICAL
    title: 쿠키 잔액 동시성 보호 누락
    description: >
      addCookie(), deductCookie() 등 잔액 변경 메서드에 락(@Lock 또는 @Version + 재시도)이 없는 경우.
      Kafka consumer와 HTTP 직접 호출이 동시에 동일 사용자 잔액을 변경하면 경합으로 잔액 오염.
