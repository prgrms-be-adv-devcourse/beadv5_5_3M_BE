version: 1
scope: service
service: movie-service

rules:
  # ──────────────────────────────────────────────
  # MOV: 도메인 로직 / 동시성 / 정합성
  # ──────────────────────────────────────────────

  - id: MOV-001
    severity: CRITICAL
    title: Schedule 좌석 수 변경 경로 락 누락
    description: >
      Schedule.decreaseRemainingSeats() / increaseRemainingSeats()를 호출하는 경로가
      ScheduleRepository.findByIdWithLock(PESSIMISTIC_WRITE) 또는 @Version 기반 낙관적 락 없이
      엔티티를 조회하는 경우.
      ticket.reserved / ticket.cancelled Kafka consumer는 동일 scheduleId에 대해 병렬 처리될 수
      있으며, 락 없이 read-modify-write를 수행하면 decrement/increment가 덮어써져 실제 좌석 수보다
      많은 예약이 허용되거나(초과 예약) 취소 후 재고 복구가 누락됨.
      Schedule.java의 주석("반드시 PESSIMISTIC_WRITE 락 하에서 호출되어야 함")은 호출자 약속에
      불과하므로, 호출 경로가 실제로 findByIdWithLock을 통과하는지 확인해야 함.
      정상 패턴(현재 구현): ScheduleService.decreaseSeat/increaseSeat가 findByIdWithLock으로 엔티티를
      조회한 뒤 도메인 메서드를 호출.

  - id: MOV-002
    severity: CRITICAL
    title: TicketEventConsumer 멱등성 가드 누락 — 좌석 재고 오염
    description: >
      TicketEventConsumer.consumeTicketReserved() / consumeTicketCancelled()가 eventId 또는
      ticketId 기반 중복 처리 방지(processed_events 테이블, existsBy 체크 등) 없이
      scheduleUseCase.decreaseSeat/increaseSeat를 호출하는 경우.
      Kafka consumer는 리밸런싱/재시도 시 동일 메시지를 재전달할 수 있으며, 본 consumer는
      DB에 멱등성 상태를 저장하지 않으므로 재처리 시 remaining_seats가 이중 감소/증가됨.
      이중 감소 시 실제 좌석보다 적은 재고로 예약 불가, 이중 증가 시 totalSeats를 초과하여
      Schedule.increaseRemainingSeats()의 SCHEDULE_EXCEEDS_TOTAL_SEATS 예외 발생 →
      Kafka 무한 재시도 루프로 consumer group 차단 위험.
      현재 코드에 "TODO: eventId 기반 idempotency 적용 고려" 주석이 있음. 이 TODO를 제거하면서
      가드를 추가하지 않으면 위반.
      정상 패턴: ticketId/eventId로 멱등성 테이블을 체크한 뒤에만 seat 변경, 또는 scheduleUseCase
      내부에서 (schedule_id, ticket_id) UNIQUE 제약으로 중복 처리 방지.

  - id: MOV-003
    severity: CRITICAL
    title: Movie 평점/리뷰 카운트 동시성 보호 누락
    description: >
      ReviewService.write()/update()/delete()에서 Movie.applyReviewCreated/Updated/Deleted()를
      호출할 때, 대상 Movie를 findByMovieId(락 없음)로 조회하여 동일 movieId에 대한 동시 요청이
      직렬화되지 않는 경우.
      averageRating 계산식은 (averageRating * reviewCount + newRating) / (reviewCount + 1) 형태의
      read-modify-write이므로, 동일 영화에 리뷰가 동시에 기록되면 reviewCount / averageRating이
      서로 덮어써져 실제와 다른 값으로 수렴. 핫한 영화일수록 드리프트 누적이 빠름.
      일일 배치(recalculateMovieRatings)가 04:00에 전체 보정하지만 당일 하루 동안 잘못된 평점이
      사용자에게 노출되며, 평점순 정렬/추천 품질도 오염됨.
      정상 패턴: MovieRepository.findByMovieIdForUpdate(PESSIMISTIC_WRITE) 추가,
      또는 Movie 엔티티에 @Version 추가 후 OptimisticLockException 발생 시 재시도.
      대안으로 리뷰 집계는 DB 집계 쿼리(COUNT/AVG)로 실시간 계산하고 캐시.

  - id: MOV-004
    severity: CRITICAL
    title: Review write — check-then-insert race (동일 유저 중복 리뷰)
    description: >
      ReviewService.write()에서 reviewRepository.existsByUserIdAndMovieId() 체크 후
      reviewRepository.save()를 수행하는 check-then-insert 패턴.
      Review 테이블의 (user_id, movie_id)에 DB UNIQUE 제약이 없으면, 같은 유저가 더블 클릭 등으로
      동시 요청을 보낼 때 두 건 모두 exists 체크를 통과하여 중복 리뷰가 생성됨.
      중복 리뷰 1건당 applyReviewCreated가 추가 호출되어 reviewCount / averageRating 정합성도 오염.
      반면 LikeService.like()는 MovieLike의 UNIQUE 제약 + DataIntegrityViolationException 처리로
      올바르게 방어함. Review도 동일 방식이 필요.
      정상 패턴: review 테이블에 (user_id, movie_id) UNIQUE 제약 추가 + save 실패 시
      DataIntegrityViolationException을 REVIEW_ALREADY_EXISTS로 변환.

  - id: MOV-005
    severity: CRITICAL
    title: Movie.applyReviewUpdated / applyReviewDeleted — division-by-zero / 음수 카운트
    description: >
      Movie.applyReviewUpdated(oldRating, newRating)은
      (averageRating * reviewCount - oldRating + newRating) / reviewCount 를 계산하며,
      호출 시점에 reviewCount == 0이면 Float 0으로 나눠 Infinity / NaN이 영속화됨.
      applyReviewDeleted()는 reviewCount == 1만 0으로 특수 처리하고 그 외 경로에서 reviewCount--
      후 음수로 빠질 수 있는지 호출자 보장에 의존.
      averageRating이 NaN으로 저장되면 JSON 직렬화/정렬 쿼리에서 예기치 못한 500 Error 또는
      정렬 순서 뒤집힘 발생. recalculateMovieRatings 배치가 04:00에 보정하지만 그 사이 사용자
      응답에 NaN이 노출됨.
      정상 패턴: applyReviewUpdated 진입 시 reviewCount > 0 가드, applyReviewDeleted에서
      감소 후 음수 방어. rating 범위 검증(1~5)은 applyReviewCreated에만 있으므로 update 경로
      (Review.update)에도 추가 필요.

  - id: MOV-006
    severity: HIGH
    title: MovieBatchService @Scheduled — 다중 인스턴스 중복 실행 방지 장치 없음
    description: >
      MovieBatchService.recalculateMovieRatings()가 @Scheduled(cron = "0 0 4 * * *")만 사용하고
      ShedLock, Quartz 클러스터 모드 등 분산 락 장치가 없는 경우.
      @Scheduled는 모든 JVM 인스턴스에서 독립적으로 실행되므로, movie-service 다중 인스턴스 배포나
      Rolling / Blue-Green 배포 중 순간적으로 두 인스턴스가 공존하면 같은 시각에 배치가
      중복 실행됨.
      recalculateRating() 로직 자체는 멱등적이지만, 전체 Movie + ReviewRatingStats를 읽어 대량
      UPDATE를 수행하므로 중복 실행 시 DB 커넥션 풀 고갈, 테이블 락 경합, I/O 스파이크가 발생하여
      같은 시각의 사용자 API 응답이 지연됨.
      정상 패턴: net.javacrumbs.shedlock의 @SchedulerLock 적용, 또는 Quartz 클러스터 모드 이관
      (ticket-service TKT-007 참고).

  - id: MOV-007
    severity: HIGH
    title: MovieIndexEventConsumer — ES 쓰기 예외 미처리로 consumer group 차단
    description: >
      MovieIndexEventConsumer의 consumeMovieUploaded/Updated/Deleted/VisibilityChanged가
      movieSearchUseCase의 색인 메서드 호출 결과에 대해 예외 처리를 하지 않는 경우.
      parseMessage()는 JSON 파싱 예외만 스킵(null 반환)하지만, Elasticsearch 쪽 장애
      (ConnectionTimeout, cluster_block_exception, mapper_parsing_exception 등)는 그대로 전파되어
      @KafkaListener가 offset을 커밋하지 못하고 무한 재시도함.
      ES 장애가 지속되면 movie-search-service groupId consumer가 차단되어 이후 색인이 모두 밀리며,
      MovieEventConsumer(movie-service groupId)는 정상 소비되므로 DB는 최신/ES는 stale한
      불일치 상태가 고착됨.
      정상 패턴: 일시적 예외(ConnectionTimeout 등)는 제한 재시도 후 DLQ, 영구 예외(문서 포맷 오류)는
      로그 후 스킵. 또는 Spring Kafka의 DefaultErrorHandler + DeadLetterPublishingRecoverer 구성.

  - id: MOV-008
    severity: HIGH
    title: MovieLikeEventListener — AFTER_COMMIT 발행 실패 silent swallow
    description: >
      MovieLikeEventListener.handleMovieLiked()가 eventPublisher.publish() 호출 예외를
      try-catch로 로깅만 하고 삼키는 패턴.
      @TransactionalEventListener(AFTER_COMMIT)은 DB 커밋 이후 실행되므로, 여기서 Kafka 발행이
      실패하면 DB에는 좋아요/취소가 반영됐지만 movie.liked 이벤트는 유실되어 downstream 서비스
      (user 추천, 크리에이터 통계 등)가 좋아요 상태를 영원히 놓침.
      catch(Exception e) { log.error(...) } 는 "실패 시 무시"를 코드로 명시한 것이므로 critical
      이벤트에는 부적절함.
      정상 패턴: outbox 테이블에 이벤트를 INSERT한 뒤 재전송 워커가 Kafka 발행 + 성공 시 outbox 삭제.
      또는 본 이벤트가 non-critical(통계 용도)임을 주석으로 명시하고, SLA / 복구 절차를 문서화.

  - id: MOV-009
    severity: HIGH
    title: ReviewAuthConsumer / UserSyncConsumer — 역직렬화 실패와 비즈니스 실패 동일 처리
    description: >
      UserSyncConsumer.consumeUserCreated/Updated/Deleted 및 ReviewAuthConsumer.consumeReviewAuthorized
      가 `catch (Exception e) { log.error(...); throw new RuntimeException(e); }` 패턴으로
      ObjectMapper 역직렬화 예외(JacksonException)와 DB/비즈니스 예외를 동일하게 rethrow 하는 경우.
      JSON 파싱 실패(poison pill)는 메시지 자체가 처리 불가능하므로 재시도해도 영원히 실패 →
      consumer group이 해당 메시지에서 무한 반복하며 후속 user.* / ticket.review.authorized 이벤트
      처리가 모두 막힘.
      TicketEventConsumer / CreatorEventConsumer / MovieEventConsumer는 JacksonException만 따로
      catch하여 skip하는 올바른 패턴을 이미 적용하고 있으므로, user/reviewAuth consumer도 동일 패턴
      필요 (프로젝트 공통 룰 _kafka.yml KFK-001 참고).
      정상 패턴: 역직렬화는 별도 try/catch로 파싱 실패만 skip → 이후 DB/비즈니스 예외만 rethrow로
      Kafka 재시도 유도. 향후 DLQ 토픽 추가 권장.

  - id: MOV-010
    severity: MEDIUM
    title: LikeService.unlike — 동시 unlike 요청 시 likeCount 이중 감소
    description: >
      LikeService.unlike()가 findByUserIdAndMovieId() + delete() + movie.decreaseLikeCount()를
      락 없이 수행하는 경우.
      동일 유저의 동시 unlike 요청(더블 클릭, 재전송)에 대해 두 트랜잭션이 모두 MovieLike 엔티티를
      조회 → 한쪽은 성공적으로 delete하고 다른 쪽은 이미 삭제된 엔티티에 대한 delete(JPA는 예외
      미발생)를 수행 → 양쪽 모두 movie.decreaseLikeCount() 호출 → likeCount 이중 감소.
      Movie.decreaseLikeCount()의 `if (likeCount > 0)` 가드는 음수 저장은 막지만, 정상 요청에 대해
      1 → -1이 아니라 1 → 0이 되어 "같은 영화를 2명이 좋아요 취소한 것"처럼 누적 드리프트 발생
      (영화가 많이 좋아요된 경우 덜 티가 나지만, 영구적으로 부정확한 카운트 유지).
      정상 패턴: MovieLike 삭제를 deleteByUserIdAndMovieId의 반환값(long)으로 검증하여 실제 삭제된
      행 수가 1일 때만 decreaseLikeCount / 이벤트 발행. 또는 Movie 엔티티에 @Version 추가.