version: 1
scope: all

rules:
  - id: SEC-001
    severity: CRITICAL
    title: 하드코딩된 시크릿
    description: >
      API 키, JWT 시크릿, DB 패스워드, MinIO 자격증명 등이 소스코드나 application.yaml 기본값에
      직접 포함된 경우. 환경 변수 또는 Secrets Manager로 분리해야 함.

  - id: LAYER-001
    severity: CRITICAL
    title: 헥사고날 레이어 경계 위반
    description: >
      domain/ 패키지가 infrastructure/ 또는 presentation/ 패키지를 import하는 경우.
      domain은 순수 비즈니스 로직만 포함해야 하며 외부 기술에 의존하면 안 됨.
      (import com.example.*.infrastructure 또는 import com.example.*.presentation 포함 시 위반)
