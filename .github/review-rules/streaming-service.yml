version: 1
scope: service
service: streaming-service

rules:
  - id: STR-001
    severity: CRITICAL
    title: sessionToken 이중 검증 누락
    description: >
      HLS 세그먼트 서빙(HlsServingService) 또는 WebSocket STOMP CONNECT 인증(StompAuthChannelInterceptor)에서
      JWT 서명·만료(StreamTokenPort.parse)만 검증하고 Redis 세션 키(stream:session:id:{sessionId}) 존재 확인
      (SessionCachePort.findBySession)이 빠진 경우.
      ForceExitJob이나 신규 세션 발급으로 kick된 토큰이 서명·만료만 유효하면 계속 접근 가능해져
      서버 측 revocation이 무력화된다. 두 검증은 AND 조건이어야 한다.

  - id: STR-002
    severity: CRITICAL
    title: HLS 파일 서빙 path traversal 방어 누락
    description: >
      LocalDirectStreamAddressAdapter(또는 신규 StreamAddressPort 어댑터)의 openSegment에서
      (1) 파일명 whitelist 정규식(예: ^[A-Za-z0-9_-]+\.(m3u8|ts)$) 또는
      (2) Path.normalize().startsWith(baseDir) 경로 이탈 체크 중 하나라도 빠진 경우.
      request path의 {file} 파라미터로 "../../secret.key" 같은 입력이 들어오면
      storage.s3-path 바깥의 임의 파일이 노출될 수 있다. 두 방어 모두 유지 필수.

  - id: STR-003
    severity: CRITICAL
    title: 매니페스트 Cache-Control no-store 누락
    description: >
      HlsController 또는 ManifestRewriter에서 .m3u8 응답에 Cache-Control: no-store 헤더가 빠진 경우.
      매니페스트는 세그먼트 URL에 sessionToken(?t=...)을 주입하므로, 캐시되면 토큰 만료·kick 이후에도
      이전 토큰 매니페스트가 공유되어 인증 우회가 가능해진다. 세그먼트(.ts)는 캐시 가능.

  - id: STR-004
    severity: CRITICAL
    title: 단일 세션 enforcement 3단계 중 일부 누락
    description: >
      EnterStreamService.issue에서 신규 세션 발급 시 다음 3단계가 모두 있어야 한다 —
      (1) SessionCachePort.findByUser로 기존 세션 조회,
      (2) 기존 세션 존재 시 KickNotifierPort.notify로 WebSocket /user/{userId}/queue/kick 푸시,
      (3) SessionCachePort.evict로 기존 session:user + session:id 키 삭제.
      한 단계라도 빠지면 계정 공유 차단(ADR 0007)이 무너진다.
      특히 evict 누락 시 새 세션 저장 후에도 기존 토큰이 Redis에 살아있어 동시 시청 가능.

  - id: STR-005
    severity: CRITICAL
    title: WebSocket SUBSCRIBE/SEND destination scheduleId 검증 누락
    description: >
      StompAuthChannelInterceptor.preSend의 SUBSCRIBE/SEND 분기에서 destination 경로의 {scheduleId}와
      simpSessionAttributes의 scheduleId 일치 확인이 빠진 경우.
      CONNECT 시 scheduleId=42로 인증된 세션이 /topic/chat/schedule/99를 구독하거나
      /app/chat/schedule/99로 메시지를 보내는 cross-schedule 접근을 차단해야 한다.
      entitlementVerified=true 체크만으로는 부족 — scheduleId mismatch는 SESSION_MISMATCH로 거절 필수.

  - id: STR-006
    severity: CRITICAL
    title: 채팅 닉네임을 클라이언트 페이로드에서 수용
    description: >
      ChatStompController 또는 ChatService에서 ChatSendRequest/클라이언트 payload의 nickname 필드를
      그대로 ChatMessage에 싣는 경우. 닉네임은 서버가 CONNECT 시점에 Entitlement.ticketId로 계산해
      simpSessionAttributes.nickname(ATTR_NICKNAME)에 캐시한 값만 사용해야 한다.
      클라이언트 nickname 허용 시 (1) 다른 유저 사칭, (2) 익명성 정책 위반
      (실명·이메일 노출), (3) XSS 페이로드 주입 경로가 된다.
