version: 1
scope: infra
technology: kafka

rules:
  - id: KFK-001
    severity: CRITICAL
    title: Kafka consumer 역직렬화 예외 처리 누락
    description: >
      @KafkaListener 메서드에서 KafkaMessageUtil.deserialize() 또는 objectMapper.readValue() 호출에
      try-catch가 없는 경우. 역직렬화 실패 시 consumer group 전체가 차단되어 서비스 다운.
      최소한 역직렬화 실패는 별도 처리(skip 또는 DLQ 전달)해야 함.

  - id: KFK-002
    severity: CRITICAL
    title: Kafka consumer 멱등성 가드 누락 (잔액/재고 변경 consumer)
    description: >
      쿠키 잔액, 좌석 재고, 리뷰 슬롯 등 돈/재고를 변경하는 Kafka consumer에서
      중복 메시지 방지 로직(existsByTicketId, existsById 등)이 없는 경우.
      Kafka 리밸런싱/재시도 시 중복 처리로 잔액 이중 차감 또는 재고 오염 발생.

  - id: KFK-003
    severity: CRITICAL
    title: 직접 ObjectMapper로 Kafka 발행
    description: >
      Kafka 메시지 직렬화에 ObjectMapper를 직접 사용하고 KafkaMessageUtil을 사용하지 않는 경우.
      KafkaMessageUtil은 오류를 IllegalArgumentException으로 래핑하여 일관된 에러 처리를 보장함.
      직접 사용 시 예외가 무시되거나 다른 방식으로 처리되어 메시지 형식 불일치 발생.
