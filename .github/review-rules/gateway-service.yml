version: 1
scope: service
service: gateway-service

rules:
  - id: GW-001
    severity: CRITICAL
    title: JWT 검증 우회 가능한 화이트리스트 패턴
    description: >
      AuthenticationFilter의 permittedPaths에 /api/** 같은 지나치게 넓은 와일드카드가 추가된 경우.
      인증 없이 보호된 엔드포인트에 접근 가능해짐. 최소 권한 원칙으로 경로를 명시해야 함.

  - id: GW-002
    severity: CRITICAL
    title: X-User-Id 헤더 외부 요청 통과 허용
    description: >
      외부 클라이언트가 설정한 X-User-Id 헤더를 제거하지 않고 그대로 다운스트림에 전달하는 경우.
      반드시 기존 헤더를 제거(mutate/remove)한 뒤 JWT에서 추출한 userId로 교체해야 함.
      헤더 추가(add)만 하면 악의적 클라이언트가 임의 userId를 주입 가능.
