# ============================================================
#  gateway-service — Production Profile
#  활성화: SPRING_PROFILES_ACTIVE=prod (환경 변수로 주입)
# ============================================================

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: creator-service
              uri: http://${BASE_IP}:${CREATOR_PORT}/
              predicates:
                - Path=/api/creators/**
              filters:
            - id: creator-service-files
              uri: http://${BASE_IP}:${CREATOR_PORT}/
              predicates:
                - Path=/files/**
              filters:
            - id: payment-service
              uri: http://${BASE_IP}:${PAYMENT_PORT}/
              predicates:
                - Path=/api/payments/**
              filters:
            #            - id: schedule-service
            #              uri: http://${BASE_IP}:${PAYMENT_PORT}/
            #              predicates:
            #                - Path=/api/schedule/**
            #              filters:
            - id: settlement-service
              uri: http://${BASE_IP}:${SETTLEMENT_PORT}/
              predicates:
                - Path=/api/settlements/**, /api/wallets/**
              filters:
            - id: ticket-service
              uri: http://${BASE_IP}:${TICKET_PORT}/
              predicates:
                - Path=/api/tickets/**
              filters:
            - id: user-service
              uri: http://${BASE_IP}:${USER_PORT}/
              predicates:
                - Path=/api/users/**
              filters:
            - id: movie-service
              uri: http://${BASE_IP}:${MOVIE_PORT}/
              predicates:
                - Path=/api/movies/**
            - id: review-service
              uri: http://${BASE_IP}:${REVIEW_PORT}/
              predicates:
                - Path=/api/reviews/**
              filters:
          #                  - RewritePath=/user-service/(?<segment>.*), /$\{segment} #/user-service(이 부분 제거)/api/users
          #                  - StripPrefix=1 #origin/endpoint 첫 번째 endpoint 제거 위 RewritePath랑 같은 효과
          default-filters:
            - name: Global
              args:
                preLogger: true
                postLogger: true

# RSA 공개키로 JWT 서명 검증 (JwtProvider.java)
jwt:
  token:
    public: ${JWT_TOKEN_PUBLIC}

# 서비스 간 통신 호스트 (ReactiveAuthorization.java)
user-service:
  host: ${USER_SERVICE_HOST:http://user-service:8085}

creator-service:
  host: ${CREATOR_SERVICE_HOST:http://creator-service:8080}

server:
  port: ${SERVER_PORT:8000}

logging:
  level:
    root: WARN
    com.example.gatewayservice: INFO
    org.springframework.cloud.gateway: WARN